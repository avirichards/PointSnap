name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / test / build / lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  python-workers:
    name: Python workers (hermetic pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker deps (hermetic subset)
        # The default `-m "not live"` suite exercises pure logic (hash parity,
        # JSON contract, parsers) and never launches a browser, so we install
        # only the lightweight runtime deps for speed + reliability. Browser-
        # transport smoke tests self-skip when patchright/camoufox are absent.
        run: pip install fastapi "uvicorn[standard]" httpx "psycopg[binary]" python-dotenv json5 selectolax curl-cffi pytest pytest-asyncio

      - name: Pytest (excludes live network tests)
        env:
          PYTHONWORKERS_SKIP_DB: "1"
        run: pytest
