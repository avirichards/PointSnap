name: Airline browser connectivity (explicit diagnostic)

on:
  workflow_dispatch:
    inputs:
      program:
        description: Airline to test with a fresh anonymous browser
        type: choice
        required: true
        default: delta
        options:
          - delta
          - smiles
          - american
      runner:
        description: Standard hosted runtime to verify
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-15

permissions:
  contents: read

jobs:
  browser-search:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install standard browser engines
        if: inputs.program == 'american'
        run: pnpm exec playwright install --with-deps --no-shell chromium webkit firefox
      - name: Install standard WebKit
        if: inputs.program == 'delta' || inputs.program == 'smiles'
        run: pnpm exec playwright install --with-deps webkit
      - name: Fresh anonymous Smiles search and every payment choice
        if: inputs.program == 'smiles'
        run: pnpm exec tsx browser-worker/probe-smiles.ts
      - name: Fresh anonymous Delta search and complete pagination
        if: inputs.program == 'delta'
        run: pnpm exec tsx browser-worker/probe-delta.ts
      - name: Installed Chrome anonymous search
        if: inputs.program == 'american'
        continue-on-error: true
        env:
          POINTSNAP_BROWSER_CHANNEL: chrome
        run: pnpm exec tsx browser-worker/probe.ts chromium
      - name: WebKit direct booking entry
        if: inputs.program == 'american'
        continue-on-error: true
        env:
          POINTSNAP_BROWSER_ENTRY: direct
        run: pnpm exec tsx browser-worker/probe.ts webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.program }}-browser-connectivity
          path: work/browser-probes/*.json
          if-no-files-found: error
          retention-days: 7
