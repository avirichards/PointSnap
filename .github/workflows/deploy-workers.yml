name: Deploy Python workers to Fly.io

on:
  push:
    branches:
      - main
      - claude/vs-scraper-day1-VlteK
    paths:
      - "python-workers/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-workers-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly auth (validates FLY_API_TOKEN secret)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set on this repository."
            echo "Add it at https://github.com/avirichards/PointSnap/settings/secrets/actions"
            exit 1
          fi
          flyctl auth whoami

      - name: Deploy worker bridge to Fly.io
        working-directory: python-workers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Smoke-test deployed worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Pull the public hostname from the fly.toml app name
          APP=$(grep '^app = ' python-workers/fly.toml | cut -d'"' -f2)
          URL="https://${APP}.fly.dev"
          echo "Worker URL: $URL"
          echo "Hitting $URL/health ..."
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$URL/health" >/dev/null; then
              echo "::notice::Worker is healthy at $URL"
              echo "$URL" > worker-url.txt
              exit 0
            fi
            echo "Health check $i/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "::warning::Worker did not respond to /health after 5 attempts. Check the Fly machine logs."
