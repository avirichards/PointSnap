name: Anonymous airline connectivity (explicit diagnostic)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/anonymous-connectivity.yml
      - scripts/check-anonymous-connectivity.ts

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check fresh anonymous requests from hosted Node
        run: pnpm exec tsx scripts/check-anonymous-connectivity.ts
      - uses: actions/upload-artifact@v4
        with:
          name: anonymous-connectivity
          path: work/anonymous-connectivity.json
          retention-days: 7
