name: One-shot — set Web Unlocker Fly secrets

# One-time helper to set BRIGHTDATA_WU_TOKEN + BRIGHTDATA_WU_ZONE on the
# pointsnap-workers Fly app. Triggered by pushing this file. The parent
# Claude session deletes this workflow immediately after it runs, so the
# token sits in git history for exactly one commit — rotate it afterward
# via the BD dashboard (the ⟳ icon next to the API key).
#
# Does NOT match the deploy-workers.yml path filter, so it won't trigger
# a redundant deploy. `flyctl secrets set` itself restarts the app with
# the new env, picking up the already-deployed Web Unlocker plugin code.

on:
  push:
    paths:
      - ".github/workflows/oneshot-set-wu-secrets.yml"
  workflow_dispatch:

jobs:
  set-wu-secrets:
    name: Set Web Unlocker secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            BRIGHTDATA_WU_TOKEN=8fe43b6b-48c4-4c83-a1c6-b7cdf761c920 \
            BRIGHTDATA_WU_ZONE=pointsnap_webunlock \
            --app pointsnap-workers
          echo "Web Unlocker secrets set; app restarting."
