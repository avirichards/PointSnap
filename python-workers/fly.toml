# Fly.io config for the PointSnap Python worker bridge.
# `fly launch --no-deploy --name pointsnap-workers` generated this scaffold;
# adjust app name + primary region for your account before `fly deploy`.

app = "pointsnap-workers"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Chromium (Patchright) needs ~1GB RAM minimum + 2 vCPUs to avoid OOM
# during page render. The free shared-cpu-1x/512mb wedge wasn't enough
# (HTTP timeouts on every login-required scrape, no logs reaching us).
# performance-2x is $30/mo on Fly's calculator but bills per-second and
# auto_stop_machines drops idle time, so real cost is closer to $5-10/mo
# at MVP traffic.
[[vm]]
  size = "performance-2x"
  memory = "2gb"

[env]
  PORT = "8000"
