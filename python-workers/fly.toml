# Fly.io config for the PointSnap Python worker bridge.
# `fly launch --no-deploy --name pointsnap-workers` generated this scaffold;
# adjust app name + primary region for your account before `fly deploy`.

app = "pointsnap-workers"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  PORT = "8000"
