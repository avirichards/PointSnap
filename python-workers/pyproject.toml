[project]
name = "pointsnap-workers"
version = "0.1.0"
description = "Python scraper workers for PointSnap (program plugins + HTTP bridge to the Next.js cockpit)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Session 5: real scraping. Day-1 ships without these.
scrape = [
    "patchright>=1.49",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "common",
    "vs",
    "aa_aadvantage",
    "ac_aeroplan",
    "af_flyingblue",
    "as_mileageplan",
    "av_lifemiles",
    "ba_avios",
    "cx_cathay",
    "dl_skymiles",
    "lh_miles_more",
    "nh_ana",
    "tk_miles_smiles",
    "ua_mp",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
